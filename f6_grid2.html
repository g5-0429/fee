<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="Mayank Singla" />
    <title>Flex Box</title>
    <link rel= "stylesheet" href="" />
    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100dvh;
            font-family: algerian;
            font-size: 16px;
            background-color: white;
            color: white;
            
        }
        section{
            padding: 10px;
        }
        .box{
            background: radial-gradient(black, #1a1a1a);
            padding: 1rem;
            color: white;
            
        }
        .gc{
        display: grid;
        grid-template-columns: repeat(3, 150px);
        grid-template-rows: repeat(3, 150px);
        gap: 10px;
        place-content: center;
        background: white;
    
        }
        #m1{
            font-size:5rem;
            text-align:center;
            grid-column:1/3;
            grid-row:1/2;
        }
        #m2{
            display: flex;
            justify-content: center;
            align-items: center;
            font-size:5rem;          
            grid-column-start:3;
            grid-column-end:4;
            grid-row:1/3;
        }
        #m3{
            display: flex;
            justify-content: center;
            align-items: center;
            font-size:5rem;
            grid-row:2/4;
        }
        #m4{
            display: flex;
            justify-content: center;
            align-items: center;
            font-size:5rem;
        }
        #m5{
            display: flex;
            justify-content: center;
            align-items: center;
            font-size:5rem;
            grid-column:2/4;
            grid-row:3/4;
        }

        
    </style>
</head>
<body>
    <section class="box"
    style="
    height: 10vh"> Header/NavBar </section>
   

    <section
    class="box gc"
    style= "height: 80vh; background-color: white"
    >
    <main class="box" id="m1">&#9816</main> 
    <main class="box" id="m2">&#9813</main> 
    <main class="box" id="m3">&#9814</main>
    <main class="box" id="m4">&#9812</main> 
    <main class="box" id="m5">&#9815</main>
 
  </section>
   
    <section
    class= "box"
    style="position: absolute; bottom:0; left:0; height:10vh; width:100%">
    Footer </section>

    
</body>
</html>
