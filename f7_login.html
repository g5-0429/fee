<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="Author" content="Mayank Singla" />
    <meta name="Description" content="Create Login Form" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>

        *{
            margin:0;
            padding: 0;
            box-sizing: border-box;
        }

       body{
            min-height: 100dvh;
            background-color: #314158;
            font-family: "calibri", algerian;
            display: flex;
            justify-content: center;
            align-items:  center;
            color: white;
        }

        section{
            background-color: black;
            width: 20rem;
            padding:1rem;
            border-radius: 8px;
            box-shadow: 0 5px 10px rgba(255, 255, 255, 0.2);
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            border: 1px solid whitesmoke;

        }

        input{
            background-color: rgba(255, 255, 255, 0.2);
            height: 40px;
            padding: 2px 10px;
            font-size: 1.1rem;
            width: 100%;
            outline: none;
            border: none;
            border-radius: 8px;
            box-shadow: 0 3px 0 rgba(236, 220, 220, 0.5);
            
        }

        button{
            width: 100%;
            margin: 0 auto;
            font-size: 1.1rem;
            height: 40px;
            background-color: blue;
            color: white;
            border-radius: 10px;

        }

        form{
            width: 100%;
            margin: 0 auto;
        }


        </style>

</head>
<body>
    <section>
        <main>
            <form action="#" method="get">
                <h2 style="text-align:center"> Login</h2>
                <br>
                <label for="email"> Email</label>
                <br>
                <input
                type="text"
                id="email"
                name="email"
                placeholder="Enter your email"
                minlength="3"
                maxlength="20"
                required
            />
            <br><br>
            
            <label for ="password"> Password </label> <br>
            <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
            />  <br><br><br>

            <button> Submit </button>

            <br><br>
            

            </form>
        </main>
    </section>
    
</body>
</html>
